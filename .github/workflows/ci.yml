name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  protocol:
    name: Protocol library (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd protocol/kotlin && ./gradlew --no-daemon test

  tools:
    name: Desktop tools + protocol loopback e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd tools && ./gradlew --no-daemon build
      - run: tools/e2e-loopback.sh 8

  android-sender:
    name: Android sender (unit tests + debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android-sender && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: sender-debug-apk, path: android-sender/app/build/outputs/apk/debug/*.apk }

  rokid-receiver:
    name: Rokid receiver (unit tests + debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd rokid-receiver && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: receiver-debug-apk, path: rokid-receiver/app/build/outputs/apk/debug/*.apk }
